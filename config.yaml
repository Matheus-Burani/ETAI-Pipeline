# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  # kept in the data but never used as model features: the row id and COMPAS's own score
  # (the redundant columns are removed earlier, by clean_dataset() -- see diagnostics.redundant_columns)
  drop_columns: ["id", "decile_score", "score_text"]

# The FINAL TEST SET. Carved out once, stratified, and locked: never used to fit,
# tune, compare or choose anything. Used only for the final assessment.
test_set:
  size: 0.2
  random_state: 42

# How models are evaluated -- stratified k-fold cross-validation on the development set
# (everything except the locked test set). Same random_state = same folds on every run,
# for every model, so comparisons are like-for-like.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  # Reported for every run. fbeta_<beta> weights recall beta times as much as precision.
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"                       # one of metrics: what tuning maximises and runs are ranked by
  n_jobs: 1                                         # -1 = all CPU cores (only pays off for slow models)

# The diagnosis, written down as cleaning rules (found in the EDA notebook).
# clean_dataset() in src/preprocessing.py reads everything below, so it never hardcodes COMPAS's column names.
diagnostics:
  id_column: "id"
  # columns that load as text purely because a placeholder token (see placeholder_tokens below)
  # shows up somewhere in them
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan": the category cleanup converts columns to text, which turns a real NaN into the string
  # "nan"; its last step turns every token listed here into NaN, so listing "nan" turns those back into gaps.
  # Safe: read_csv already reads a literal "nan" in the file as missing, so any "nan" string was created by the cleanup.
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # multicollinearity casualties (see the EDA notebook's correlation heatmap + VIF section) --
  # dropped by clean_dataset(), so they never reach the features
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# The preprocessing recipe. Every step here is FITTED on training rows only, inside the
# model's Pipeline. Encoder and scaler are chosen by hand (reasons below).
preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      # compact (1 column per feature) and informative; sklearn's version cross-fits, so no leak
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "robust"       # median/IQR: the few extreme counts (e.g. priors_count) don't set the scale for everyone
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  # MNAR-diagnosed columns get an extra "_was_missing" flag alongside their imputed value,
  # so the model can still see the pattern even though the fill itself is just a median/mode
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42                                  # seed for the target encoder's internal cross-fitting
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

# Pick ONE model: keep one block active and the others commented out. `params` go straight to
# the model, so never leave another model's params behind (n_estimators under logistic_regression
# raises a TypeError). If tuning is on, its search space for the active model is read below.
model:
  type: "hist_gradient_boosting"  # dummy | logistic_regression | naive_bayes | decision_tree | random_forest | oblique_random_forest | adaboost | gradient_boosting | hist_gradient_boosting
  params:
    {random_state: 42, class_weight: balanced}
  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # (GradientBoostingClassifier and GaussianNB have no class_weight).
  # logistic_regression:    {max_iter: 2000, class_weight: balanced}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42, class_weight: balanced}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # gradient_boosting:      {random_state: 42}
  # hist_gradient_boosting: {random_state: 42, class_weight: balanced}

tuning:
  enabled: true                                     # false to skip tuning (and for "dummy")
  n_trials: 30                                      # use a small number while testing
  n_splits: 5                                       # folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # One space per model type; only the one matching model.type is read.
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  # The prep__ lines also tune the preprocessing (imputation, scaler, encoder). They are our own
  # addition to the model's parameters; delete them to tune the model only.
  # Ensembles take minutes per run: use a small n_trials while testing.
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
      prep__numeric__impute__strategy: {type: categorical, choices: ["median", "mean"]}
      prep__categorical__encode: {type: categorical, choices: ["onehot", "ordinal", "target"]}

    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}   # regularization strength, smaller = stronger
      model__class_weight: {type: categorical, choices: [null, "balanced"]}
      prep__numeric__impute__strategy: {type: categorical, choices: ["median", "mean"]}
      prep__numeric__scale: {type: categorical, choices: ["none", "standard", "robust"]}
      prep__categorical__encode: {type: categorical, choices: ["onehot", "ordinal", "target"]}

    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
      prep__numeric__impute__strategy: {type: categorical, choices: ["median", "mean"]}
      prep__categorical__encode: {type: categorical, choices: ["onehot", "ordinal", "target"]}

    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
      prep__numeric__impute__strategy: {type: categorical, choices: ["median", "mean"]}
      prep__categorical__encode: {type: categorical, choices: ["onehot", "ordinal", "target"]}

    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
      prep__numeric__impute__strategy: {type: categorical, choices: ["median", "mean"]}
      prep__categorical__encode: {type: categorical, choices: ["onehot", "ordinal", "target"]}

    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}

    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 0.000001, high: 10.0, log: true}

    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000000001, high: 0.1, log: true}

output:
  results_dir: "results"
  scoreboard: "results/runs.csv"                    # one row per run; delete it when the data, cleaning or folds change